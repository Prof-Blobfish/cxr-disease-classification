# Stage 2 of ImageNet -> CheXpert -> NIH: efficientnet_v2_s_448 with the backbone from
# experiments/efficientnet_v2_s_chexpert_pretrain.yaml. Same recipe and seeds, so the
# difference is the initialisation alone. Train the pretraining run first:
#   python src/train.py --config experiments/efficientnet_v2_s_chexpert_pretrain.yaml --seed 42
base_config: experiments/efficientnet_v2_s_v1.yaml
overrides:
  image_size: 448
  num_epochs: 6
  pretrained: false
  domain_pretrained:
    path: outputs/experiments/efficientnet_v2_s_chexpert_pretrain/seed42/checkpoints/best.pt
    source: "ImageNet -> CheXpert-v1.0-small (frontal, 13 findings)"
    backbone_only: true
seeds: [42, 44]
