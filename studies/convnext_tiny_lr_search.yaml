# Broad optimiser/augmentation search at 320px.
base_config: experiments/convnext_tiny_v7.yaml
seeds: [42]
n_trials: 25
search_space:
  optimizer.backbone_lr: {low: 1.0e-5, high: 5.0e-4, log: true}
  optimizer.head_lr: {low: 1.0e-4, high: 2.0e-3, log: true}
  optimizer.weight_decay: {low: 1.0e-6, high: 1.0e-3, log: true}
  augmentation.train.rotation_deg: {low: 0, high: 20}
  augmentation.train.horizontal_flip: {choices: [true, false]}
