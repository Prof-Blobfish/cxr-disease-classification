# Stage 2 of ImageNet -> CheXpert -> NIH: maxvit_t at 448px with the backbone from
# experiments/maxvit_t_chexpert_pretrain.yaml (train that first, seed 42). Convolution + attention hybrid; image_size must be a multiple of 224.
# Batch size is provisional until measured with src/benchmark.py.
base_config: experiments/convnext_tiny_v8.yaml
overrides:
  model_name: maxvit_t
  image_size: 448
  batch_size: 16
  num_epochs: 9
  amp_dtype: bfloat16
  pretrained: false
  domain_pretrained:
    path: outputs/experiments/maxvit_t_chexpert_pretrain/seed42/checkpoints/best.pt
    source: "ImageNet -> CheXpert-v1.0-small (frontal, 13 findings), 6 epochs"
    backbone_only: true
seeds: [42]
