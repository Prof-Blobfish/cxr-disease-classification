# convnext_small_chexpert_448 (same CheXpert backbone, recipe and seed), fine-tuned on NIH and
# CheXpert jointly, as efficientnet_v2_s_joint_448. One seed first; add 44 if joint training helps.
base_config: experiments/convnext_tiny_v8.yaml
overrides:
  model_name: convnext_small
  image_size: 448
  batch_size: 16
  num_epochs: 9
  joint: {dataset: chexpert, ratio: 1.0}
  pretrained: false
  domain_pretrained:
    path: outputs/experiments/convnext_small_chexpert_pretrain/seed42/checkpoints/best.pt
    source: "ImageNet -> CheXpert-v1.0-small (frontal, 13 findings), 6 epochs"
    backbone_only: true
seeds: [42]
