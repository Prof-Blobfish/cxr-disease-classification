# Stage 1 of ImageNet -> CheXpert -> NIH for eva_x_base: the vit_b_16_v1 recipe on CheXpert-v1.0-small
# frontal images (13 findings), 6 epochs. Starts from EVA-X (masked image modelling on ~520k chest X-rays), not ImageNet.
# Batch size is provisional until measured with src/benchmark.py. Selected on macro AUROC:
# CheXpert's mapped uncertain labels distort the clinical score.
dataset: chexpert
model_name: eva_x_base
pretrained: true
selection_metric: macro_auroc
split_seed: 0
deterministic: false
use_amp: true
amp_dtype: bfloat16       # more stable than fp16 for transformers
channels_last: true
compile_model: true
image_size: 384
batch_size: 32
num_epochs: 6
warmup_epochs: 1
patience: null            # train the full schedule; the best epoch is still kept
optimizer:
  backbone_lr: 1.0e-04
  layer_decay: 0.65
  head_lr: 1.0e-03
  weight_decay: 0.05
scheduler: cosine
ema_decay: 0.999
loss: bce                 # weighted_bce = pos_weight-balanced BCE (v7)
tta_hflip: true
augmentation:
  train:
    random_resized_crop_scale: [0.75, 1.0]
    horizontal_flip: true
    rotation_deg: 15
    brightness: 0.15
    contrast: 0.15
clinical_score:
  sensitivity_range: [0.90, 0.99]
  prevalence_weight_power: 0.5
  ranking_weight: 0.6
drop_path: 0.1
