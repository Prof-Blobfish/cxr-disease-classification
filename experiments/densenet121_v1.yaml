model_name: densenet121
pretrained: true
selection_metric: clinical_score
split_seed: 0
deterministic: true
image_size: 256
batch_size: 32
num_epochs: 30
patience: 7
optimizer:
  backbone_lr: 0.0001
  head_lr: 0.001
  weight_decay: 0.0001
augmentation:
  train:
    horizontal_flip: false
    rotation_deg: 10
    brightness: 0.05
    contrast: 0.05
scheduler: cosine
