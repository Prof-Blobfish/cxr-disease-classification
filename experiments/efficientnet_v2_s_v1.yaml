# EfficientNetV2-S with the v8 recipe, for ensemble diversity. LRs are standard
# fine-tuning values, not tuned.
model_name: efficientnet_v2_s
pretrained: true
selection_metric: clinical_score
split_seed: 0
deterministic: false
use_amp: true
amp_dtype: float16
channels_last: true
compile_model: true
image_size: 320
batch_size: 32
num_epochs: 12
warmup_epochs: 1
patience: null            # train the full schedule; the best epoch is still kept
optimizer:
  backbone_lr: 1.0e-04
  head_lr: 1.0e-03
  weight_decay: 0.05
scheduler: cosine
ema_decay: 0.999
drop_path: 0.2
loss: bce                 # weighted_bce = pos_weight-balanced BCE (v7)
tta_hflip: true
augmentation:
  train:
    random_resized_crop_scale: [0.75, 1.0]
    horizontal_flip: true
    rotation_deg: 15
    brightness: 0.15
    contrast: 0.15
clinical_score:
  sensitivity_range: [0.90, 0.99]
  prevalence_weight_power: 0.5
  ranking_weight: 0.6
