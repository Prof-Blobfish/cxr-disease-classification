model_name: convnext_tiny
pretrained: true
selection_metric: clinical_score
split_seed: 0
deterministic: false
use_amp: true
amp_dtype: float16
channels_last: true
compile_model: false
compile_mode: reduce-overhead
image_size: 320
batch_size: 32
num_epochs: 30
patience: 7
optimizer:
  backbone_lr: 8.0e-05
  head_lr: 0.0008
  weight_decay: 5.0e-05
augmentation:
  train:
    horizontal_flip: false
    rotation_deg: 10
    brightness: 0.05
    contrast: 0.05
    translate: 0.01
scheduler: cosine
